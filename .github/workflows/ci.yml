name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  package:
    name: packed tarball works
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install the tarball in a fresh project and run init + doctor
        run: |
          npm pack --silent
          mkdir /tmp/demo && cd /tmp/demo
          echo '{"name":"demo"}' > package.json
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/ai-rules-*.tgz
          npx --no-install ai-rules init --all -y
          npx --no-install ai-rules doctor --ci
